<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusPENse</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="intro.css">
</head>
<body>
    <canvas class="webgl"></canvas>
    <script type="module" src="./intro.js"></script>
    <div class="cloud-noise-bg"> <svg style="display: none;"> <filter id="cloudNoise"> <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" stitchTiles="stitch"/> </filter> </svg> </div>
    
    
    <div id="navbar"></div><br /><br /><br /><br /><br />
    <div style="display: flex; justify-content: center;">
        <div class="icon-dot">
            <img src="./assets/battery.svg" width="70px">
        </div>
        <span class="title">SusPENse</span>
        <div class="icon-dot">
            <img src="./assets/drone.svg" width="70px">
        </div>
    </div>
    <div style="display: flex; justify-content: center; gap: 50px;">
        <div class="icon-dot">
            <img src="./assets/plane.svg" width="70px">
        </div>
        <span class="title">LTD</span>
        <div class="icon-dot">
            <img src="./assets/propeller.svg" width="70px" style="position: relative; left: 6px;">
        </div>
    </div><br />
    <div style="text-align: center;">
        <a href="https://github.com/FreeformWave544/Suspense">Fully Open-Source @ GitHub.com!</a>
    </div>
    <div style="position: fixed; right: 7%; bottom: calc(400px + 1vh);">
        Drag to Move in 3D!
    </div>
    <div class="cloud-noise-bg"> <svg style="display: none;"> <filter id="cloudNoise"> <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" stitchTiles="stitch"/> </filter> </svg> </div>
    <script type="module" src="./intro.js"></script>
</body>
</html>

<script type="module">
    import * as THREE from 'three'
    import gsap from 'gsap'
    import { HDRLoader, TextGeometry } from 'three/addons/Addons.js'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import { FontLoader } from 'three/addons/loaders/FontLoader.js'
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
    import { Scene, Vector2 } from 'three/webgpu'
    import { and, viewport } from 'three/tsl'

    const canvas = document.querySelector('canvas.webgl')

    const scene = new THREE.Scene()

    const textureLoader = new THREE.TextureLoader()
    const fontLoader = new FontLoader()
    const logoTexture = textureLoader.load('./imgs/pfp/FreeformWave.png')
    logoTexture.colorSpace = THREE.SRGBColorSpace

    const cursor = {
        x: 0,
        y: 0
    }

    const sizes = {
        width: 400,
        height: 400
    }

    const camera = new THREE.PerspectiveCamera(
        60,
        1,
        0.1,
        1000
    )

    camera.position.z = 5

    scene.add(camera)

    const controls = new OrbitControls(
        camera,
        canvas
    )

    controls.enableDamping = true
    controls.minDistance = 3.2
    controls.maxDistance = 50

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5)
    scene.add(ambientLight)

    const directionalLight = new THREE.DirectionalLight(0xffffff, 3)
    directionalLight.position.set(2, 3, 4)
    scene.add(directionalLight)

    const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
    })

    renderer.setSize(sizes.width, sizes.height)

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    )

    renderer.setSize(
        sizes.width,
        sizes.height
    )

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    )

    window.addEventListener('mousemove', (event) =>
    {
        cursor.x = event.clientX / sizes.width - 0.5
        cursor.y = event.clientY / sizes.height - 0.5
    })

    window.addEventListener('resize', () =>
    {
        renderer.setSize(300, 300)
        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        )
    })

    const intro = () => {
        for (let i = 0; i < 500; i++ ) {
            const timeout = ms => new Promise(resolve => setTimeout(resolve, ms));
            spinSpeed = 0.0;
            setTimeout(() => {
                logo.scale.x += 0.00005 * i;
                logo.scale.y += 0.00005 * i;
                logo.rotation.x *= 0.9; logo.rotation.y *= 0.9; logo.rotation.z *= 0.9;
                if (i == 499) {
                    document.getElementById("continue").classList.remove("hidden")
                }
            }, i * 15);
        }
    }

    const material = new THREE.MeshPhongMaterial({
        map: logoTexture,
        shininess: 70,
        specular: new THREE.Color('#faa8a8'),
        side: THREE.DoubleSide
    })

    const logo = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.0, 1, 1), material)

    const droneLoader = new GLTFLoader();
    let drone = null
    droneLoader.load('./assets/SusPENse.gltf', (gltf) => {
        drone = gltf.scene
        drone.scale.set(100, 100, 100)
        scene.add(drone)
    })

    const clock = new THREE.Timer()
    var spinSpeed = 1.0
    let parallaxSpeed = 1.0
    let direction = new Vector2(1.0, 1.0)
    const tick = (timestamp) =>
    {
        clock.update(timestamp)
        const delta = clock.getDelta()
        const elapsed = clock.getElapsed()
        controls.update()
        renderer.render(
            scene,
            camera
        )
        window.requestAnimationFrame(tick)
    }

    tick()
</script>
